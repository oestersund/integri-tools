<style>
:root{
  --bg:#EAE8E5; --surface:#FFFFFF; --primary:#24395E; --primary-hover:#16233B;
  --ink:#1C2430; --muted:#4B5566; --on-primary:#FFFFFF;
  --accent:#943527; --accent-hover:#7E2D21; --border:#DCE2E8;
  --ok:#3F6B52; --warn:#8F5F0C;
  --sage:color-mix(in srgb, #24395E 8%, #FFFFFF);
  --accent-tint:color-mix(in srgb, #943527 10%, #FFFFFF);
  --ok-tint:color-mix(in srgb, #3F6B52 12%, #FFFFFF);
  --warn-tint:color-mix(in srgb, #8F5F0C 12%, #FFFFFF);
  --shadow:0 1px 2px rgba(28,36,48,.04), 0 10px 26px rgba(28,36,48,.08);
  --sans:'Public Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  --serif:'Newsreader','Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#15191F; --surface:#1E242D; --primary:#9DB4DA; --primary-hover:#B8CBE8;
    --ink:#E6E9EE; --muted:#A3ACB9; --on-primary:#10151C;
    --accent:#E08A78; --accent-hover:#EBA293; --border:#333C48;
    --ok:#8BC2A2; --warn:#E0B462;
    --sage:#232C3A; --accent-tint:#35231F; --ok-tint:#1F3027; --warn-tint:#352B18;
    --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15191F; --surface:#1E242D; --primary:#9DB4DA; --primary-hover:#B8CBE8;
  --ink:#E6E9EE; --muted:#A3ACB9; --on-primary:#10151C;
  --accent:#E08A78; --accent-hover:#EBA293; --border:#333C48;
  --ok:#8BC2A2; --warn:#E0B462;
  --sage:#232C3A; --accent-tint:#35231F; --ok-tint:#1F3027; --warn-tint:#352B18;
  --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 26px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:24px 48px}
.wrap{max-width:680px;margin-inline:auto;display:flex;flex-direction:column;gap:20px}
header.kopf{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.marke{font-family:var(--serif);font-size:20px;font-weight:600;color:var(--primary);letter-spacing:.01em}
.marke span{font-family:var(--sans);font-size:12px;font-weight:500;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-left:10px}
.status{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.status::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.status.ok::before{background:var(--ok)}
.status.lokal::before{background:var(--warn)}
.fortschritt{display:flex;flex-direction:column;gap:6px}
.fortschritt .leiste{height:6px;border-radius:3px;background:var(--border);overflow:hidden}
.fortschritt .leiste i{display:block;height:100%;background:var(--primary);width:0;transition:width .25s ease}
.fortschritt .text{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.karte{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:28px;display:flex;flex-direction:column;gap:20px}
@media (max-width:480px){.karte{padding:20px}}
.abschnitt{font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent)}
h1{font-family:var(--serif);font-weight:500;font-size:30px;line-height:1.2;margin:0;text-wrap:balance}
.aussage{font-family:var(--serif);font-size:24px;line-height:1.35;font-weight:500;margin:0;text-wrap:balance}
@media (max-width:480px){.aussage{font-size:21px} h1{font-size:26px}}
p{margin:0;max-width:62ch}
.leise{color:var(--muted);font-size:14px}
.szene{border-left:3px solid var(--border);padding-left:16px;font-family:var(--serif);font-size:17px;line-height:1.55;color:var(--ink)}
.wahl{display:flex;border:1px solid var(--primary);border-radius:11px;overflow:hidden;width:max-content;max-width:100%}
.wahl button{appearance:none;border:0;border-right:1px solid var(--primary);background:var(--surface);color:var(--primary);font:600 16px var(--sans);padding:12px 26px;cursor:pointer;min-height:48px}
.wahl button:last-child{border-right:0}
.wahl button:hover{background:var(--sage)}
.wahl button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary)}
@media (max-width:420px){.wahl{width:100%}.wahl button{flex:1;padding:12px 8px}}
label.feld{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:var(--muted)}
textarea,input[type="number"]{font:16px/1.5 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:10px 12px;width:100%}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus,button:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.zahl{display:flex;align-items:center;gap:10px;max-width:260px}
.zahl input{flex:1}
.zahl .einheit{color:var(--muted);font-size:15px;white-space:nowrap}
.pflicht{color:var(--accent);font-size:13px}
.navi{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.btn{appearance:none;font:600 15px var(--sans);border-radius:11px;padding:11px 20px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--ink);min-height:44px}
.btn:hover{background:var(--sage)}
.btn.vor{background:var(--accent-tint);color:var(--accent);border-color:color-mix(in srgb, var(--accent) 30%, var(--surface))}
.btn.vor:hover{background:color-mix(in srgb, var(--accent) 20%, var(--surface))}
.btn.cta{background:var(--accent);color:#FFFFFF;border-color:var(--accent)}
.btn.cta:hover{background:var(--accent-hover)}
:root[data-theme="dark"] .btn.cta{color:#1A1111}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .btn.cta{color:#1A1111}}
.btn:disabled{opacity:.45;cursor:default}
.uebersicht{display:flex;flex-direction:column;gap:0;border-top:1px solid var(--border)}
.uebersicht button{appearance:none;background:none;border:0;border-bottom:1px solid var(--border);text-align:left;display:grid;grid-template-columns:48px 1fr auto;gap:12px;align-items:baseline;padding:10px 4px;font:15px/1.4 var(--sans);color:var(--ink);cursor:pointer}
.uebersicht button:hover{background:var(--sage)}
.uebersicht .nr{font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
.uebersicht .kurz{overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 10px;white-space:nowrap}
.chip.ja{background:var(--ok-tint);color:var(--ok)}
.chip.nein{background:var(--accent-tint);color:var(--accent)}
.chip.anders{background:var(--warn-tint);color:var(--warn)}
.chip.leer{background:var(--sage);color:var(--muted)}
.chip.wert{background:var(--sage);color:var(--primary)}
.hinweis{background:var(--sage);border-radius:14px;padding:14px 16px;font-size:14px;color:var(--ink)}
.kopie{font:13px/1.5 ui-monospace,Menlo,monospace;min-height:160px}
.rang{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;counter-reset:r}
.rang li{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;border:1px solid var(--border);border-radius:11px;padding:8px 8px 8px 12px;background:var(--surface)}
.rang li::before{counter-increment:r;content:counter(r);font:600 15px var(--sans);color:var(--primary);font-variant-numeric:tabular-nums}
.rang .pfeile{display:flex;gap:6px}
.rang .pfeile button{appearance:none;width:40px;height:40px;border-radius:9px;border:1px solid var(--border);background:var(--surface);color:var(--primary);font:600 18px var(--sans);cursor:pointer}
.rang .pfeile button:hover{background:var(--sage)}
.rang .pfeile button:disabled{opacity:.3;cursor:default}
.optionen{display:flex;flex-direction:column;gap:8px}
.optionen button{appearance:none;text-align:left;font:500 16px/1.4 var(--sans);color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;min-height:48px}
.optionen button:hover{background:var(--sage)}
.optionen button[aria-pressed="true"]{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.fertig-marke{font-family:var(--serif);font-size:22px;color:var(--ok)}
@media (prefers-reduced-motion:reduce){.fortschritt .leiste i{transition:none}}
</style>

<div class="wrap">
  <header class="kopf">
    <div class="marke">Kartesa<span>Prüfbogen Wunschkundin</span></div>
    <div class="status" id="status" role="status">Wird verbunden …</div>
  </header>
  <div class="fortschritt" id="fortschritt" hidden>
    <div class="leiste"><i id="balken"></i></div>
    <div class="text"><span id="schrittText"></span><span id="abschnittText"></span></div>
  </div>
  <main class="karte" id="karte" aria-live="polite"></main>
</div>

<script>
const SZENE = "Auf dem Tisch liegen drei Karteikarten, der Laptop zeigt den Kalender der Woche. Für jede Rechnung öffnet sie den Termin, wechselt in die Abrechnung, sucht den Patienten noch einmal und klickt sich durch den Katalog, rund zehn Minuten je Rechnung. Bei einer Patientin fällt ihr ein, dass der Laborbericht noch im Postfach liegt. Die Notizen vom Donnerstag hat sie sich vorgenommen und nicht geschrieben. Eine Kollegin hat im Qualitätszirkel erzählt, sie spreche ihre Notizen inzwischen ein. Aber wohin gehen die Aufnahmen?";

const FRAGEN = [
  // A · Gibt es sie?
  {id:"W1", art:"text", abschnitt:"Gibt es sie?", text:"Kennst du Kolleginnen, die eine Praxissoftware für Termine und Rechnungen nutzen, bei denen die Dokumentation aber liegen bleibt oder auf Papier läuft? Woran erkennst du sie?", hilfe:"Ein paar Stichworte reichen. Wenn du keine kennst, schreib das. Dann stimmt unser Bild nicht."},
  {id:"W2", art:"auswahl", abschnitt:"Gibt es sie?", text:"Wie viele deiner Kolleginnen gehören ungefähr zu dieser Gruppe?", optionen:["Fast keine","Etwa ein Viertel","Etwa die Hälfte","Die meisten"]},
  {id:"W3", art:"urteil", abschnitt:"Gibt es sie?", text:"Sie führt ihre Praxis allein, ohne Mitarbeitende, und macht Termine und Rechnungen selbst."},
  {id:"W4", art:"urteil", abschnitt:"Gibt es sie?", text:"Ihre Akte ist ein Mix: Software für die Rechnung, dazu Karteikarte, Mails, Laborberichte und Notizen."},
  // B · Pains
  {id:"P1", art:"rang", abschnitt:"Was sie drückt", text:"Was ärgert sie am meisten? Bring die Punkte in ihre Reihenfolge, das Schlimmste nach oben.", optionen:[
    "Die Dokumentation bleibt liegen, sie schreibt abends oder am Wochenende nach",
    "Unterlagen liegen verstreut: Papier, Mail, Laborbericht, Mappe",
    "Rechnungen schreiben dauert lange, manche werden vergessen",
    "Die Software ist umständlich: viel bezahlt, wenig genutzt",
    "Unsicherheit beim Datenschutz, etwa beim Versand oder bei KI"]},
  {id:"P2", art:"text", abschnitt:"Was sie drückt", text:"Was sagt sie wörtlich, wenn sie über ihre Verwaltung oder Dokumentation klagt?", hilfe:"Gern in ihren eigenen Worten, auch ein halber Satz hilft. Genau diese Sätze brauchen wir für die Website."},
  {id:"P3", art:"urteil", abschnitt:"Was sie drückt", text:"Dass die Dokumentation liegen bleibt, hält sie für eine Frage ihrer eigenen Disziplin, nicht der Software."},
  {id:"P4", art:"text", abschnitt:"Was sie drückt", text:"Was hat sie schon versucht, um es besser zu machen, und woran ist es gescheitert?", hilfe:"Zum Beispiel ein anderes Programm, Diktiergerät, feste Schreibzeiten, eine Hilfe fürs Büro."},
  // C · Gains und Transformation
  {id:"G1", art:"text", abschnitt:"Wohin sie will", text:"Stell dir vor, ein halbes Jahr nach dem Wechsel läuft alles gut. Was ist dann an ihrem Praxistag anders? Was erzählt sie einer Kollegin?"},
  {id:"G2", art:"rang", abschnitt:"Wohin sie will", text:"Was wäre ihr am meisten wert? Das Wichtigste nach oben.", optionen:[
    "Abende und Wochenenden ohne Nachschreiben",
    "Im Gespräch alles zur Patientin vor Augen haben",
    "Sprechen statt tippen",
    "Alles an einem Ort, das Papier darf ins Archiv",
    "Rechnungen mit einem Klick, keine vergessen",
    "Ruhe beim Datenschutz"]},
  {id:"G3", art:"urteil", abschnitt:"Wohin sie will", text:"Es geht ihr nicht nur um gesparte Zeit, sondern um das Gefühl, ihre Praxis im Griff zu haben und nach außen gut organisiert zu wirken."},
  // D · Wissensstand
  {id:"K1", art:"auswahl", abschnitt:"Was sie schon weiß", text:"Wo steht sie typischerweise?", optionen:[
    "Sie hält den Aufwand für normal und sucht nichts",
    "Sie leidet darunter, weiß aber nicht, dass es anders geht",
    "Sie weiß, dass es Lösungen gibt (Diktat, KI, andere Software), hat aber keine gewählt",
    "Sie vergleicht schon konkrete Programme"]},
  {id:"K2", art:"urteil", abschnitt:"Was sie schon weiß", text:"Sie verbindet KI noch gar nicht mit ihrer Patientenakte."},
  {id:"K3", art:"urteil", abschnitt:"Was sie schon weiß", text:"Wenn sie Transkription kennt, zum Beispiel Heidi, hat sie Bedenken, wo die Daten landen."},
  {id:"K4", art:"urteil", abschnitt:"Was sie schon weiß", text:"Sie beurteilt eine neue Software an dem, was ihre alte kann. Den Nutzen einer anders gebauten Akte kann sie sich schwer vorstellen."},
  // E · Entscheidung
  {id:"E1", art:"urteil", abschnitt:"Wie sie sich entscheidet", text:"Den Anstoß, etwas Neues auszuprobieren, gibt vor allem eine Empfehlung aus dem Kollegenkreis."},
  {id:"E2", art:"urteil", abschnitt:"Wie sie sich entscheidet", text:"Ein Angebot über den Berufsverband, etwa ein Mitgliedercode beim FDH, würde ihr Vertrauen geben."},
  {id:"E3", art:"urteil", abschnitt:"Wie sie sich entscheidet", text:"Vor dem Kauf will sie lieber ein kostenloses Gespräch mit Vorführung, als allein etwas auszuprobieren."},
  {id:"E4", art:"rang", abschnitt:"Was sie zögern lässt", text:"Was hält sie am ehesten zurück? Den stärksten Einwand nach oben.", optionen:[
    "„Dann habe ich zwei Programme.“",
    "Der Umzug der Daten aus dem alten Programm",
    "Datenschutz bei Sprache und KI",
    "Vertrauen in einen kleinen, neuen Anbieter",
    "Einarbeitung und Einrichtung",
    "Der Preis"]},
  {id:"E5", art:"urteil", abschnitt:"Was sie zögern lässt", text:"„Ich gebe jeden Versand selbst frei“ und „Absender ist meine Praxisadresse“ sind Bedingungen. Ohne sie kauft sie nicht."},
  {id:"E6", art:"text", abschnitt:"Was sie zögern lässt", text:"Was müsste sie sehen oder hören, damit sie sagt: „Das probiere ich aus“?"},
  // F · Sprache und Szene
  {id:"S1", art:"urteil", abschnitt:"Wie wir sie ansprechen", text:"Sie möchte auf einer Website mit „Sie“ angesprochen werden, aber im Ton einer Kollegin."},
  {id:"S2", art:"urteil", abschnitt:"Wie wir sie ansprechen", text:"Ihre Wörter sind Patientin, Karteikarte, Akte, Behandlung, Anamnese. Begriffe wie „Workflow“ oder „KI-Assistent“ schrecken sie eher ab."},
  {id:"S3", art:"urteil", abschnitt:"Die Szene", text:"So einen Sonntagabend kennt sie.", szene:true, hilfe:"Was fehlt, was stimmt nicht?"},
  // G · Preis
  {id:"C17", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"€ im Monat", text:"Was zahlt sie heute im Monat für ihre Praxissoftware, einschließlich Zusatzdiensten wie Unterschrift oder Formularen?"},
  {id:"C18", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"€ im Monat", text:"Bei welchem Monatspreis wäre Kartesa so günstig, dass sie an der Qualität zweifelt?", hilfe:"Gemeint ist das Paket aus Akte, Terminen und Rechnungen."},
  {id:"C19a", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"€ im Monat", text:"Welcher Monatspreis wäre für sie günstig?"},
  {id:"C19b", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"€ im Monat", text:"Welcher Monatspreis wäre teuer, aber noch vertretbar?"},
  {id:"C20", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"€ im Monat", text:"Ab welchem Monatspreis käme Kartesa für sie gar nicht mehr in Frage?"},
  {id:"C21", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"Wochen", text:"Wie lang muss eine kostenlose Testphase sein, damit sie sich einen echten Eindruck machen kann?"},
  {id:"C22", art:"zahl", abschnitt:"Was sie zahlen würde", einheit:"% Rabatt", text:"Wie hoch muss ein Rabatt für Verbandsmitglieder sein, damit er als echtes Angebot wirkt?"},
  // H · Ränder
  {id:"R1", art:"text", abschnitt:"Zum Schluss", text:"Gibt es eine Gruppe von Kolleginnen, die aus einem ganz anderen Grund kaufen würde?", hilfe:"Zum Beispiel wegen der Abrechnung, weil sie neu gründen oder weil sie die Akte mit anderen teilen. Wer, und warum?"},
  {id:"R2", art:"text", abschnitt:"Zum Schluss", text:"Welchen Kolleginnen würdest du von Kartesa eher abraten, und warum?"}
];

const s = {antworten:{}, schritt:-1, fertig:false};
let db = null, docRef = null, verbunden = false, speichernAktiv = false, speichernNochmal = false, lokalerSchluessel = "kartesa-pruefbogen-p1-v2";
const $ = id => document.getElementById(id);
const karte = $("karte");

function lokalLesen(){ try{ const r = localStorage.getItem(lokalerSchluessel); return r ? JSON.parse(r) : null; }catch(e){ return null; } }
function lokalSchreiben(){ try{ localStorage.setItem(lokalerSchluessel, JSON.stringify({antworten:s.antworten, fertig:s.fertig})); }catch(e){} }

function setzeStatus(art, text){ const el=$("status"); el.className="status "+art; el.textContent=text; }

async function speichern(){
  lokalSchreiben();
  if(!docRef){ return; }
  if(speichernAktiv){ speichernNochmal = true; return; }
  speichernAktiv = true;
  try{
    await docRef.set({antworten:s.antworten, fertig:s.fertig, stand:new Date().toISOString(), bogen:"IV-149 Wunschkundin v2"});
    setzeStatus("ok","Gespeichert");
  }catch(e){
    setzeStatus("lokal","Antworten bleiben auf diesem Gerät");
    docRef = null;
  }
  speichernAktiv = false;
  if(speichernNochmal){ speichernNochmal = false; speichern(); }
}

function beantwortet(f){
  const a = s.antworten[f.id];
  if(!a) return false;
  if(f.art==="urteil") return !!a.wahl && (a.wahl!=="Anders" || (a.notiz||"").trim().length>0);
  if(f.art==="zahl") return a.wert!=null && a.wert!=="";
  if(f.art==="rang") return Array.isArray(a.reihenfolge);
  if(f.art==="auswahl") return !!a.wahl;
  return (a.notiz||"").trim().length>0;
}

function fortschritt(){
  const box=$("fortschritt");
  if(s.schritt<0 || s.schritt>=FRAGEN.length){ box.hidden = s.schritt<0; }
  else box.hidden=false;
  const erledigt = FRAGEN.filter(beantwortet).length;
  $("balken").style.width = (erledigt/FRAGEN.length*100)+"%";
  if(s.schritt>=0 && s.schritt<FRAGEN.length){
    $("schrittText").textContent = "Frage "+(s.schritt+1)+" von "+FRAGEN.length;
    $("abschnittText").textContent = erledigt+" beantwortet";
  } else {
    $("schrittText").textContent = "Übersicht";
    $("abschnittText").textContent = erledigt+" von "+FRAGEN.length+" beantwortet";
  }
}

function el(tag, attrs, ...kinder){
  const e=document.createElement(tag);
  for(const [k,v] of Object.entries(attrs||{})){
    if(v==null) continue;
    if(k==="class") e.className=v; else if(k==="text") e.textContent=v;
    else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);
  }
  for(const k of kinder){ if(k!=null) e.append(k); }
  return e;
}

function zeigeStart(){
  s.schritt=-1; fortschritt();
  karte.replaceChildren(
    el("div",{class:"abschnitt",text:"Für Christiane"}),
    el("h1",{text:"Wer ist unsere Wunschkundin, und gibt es sie wirklich?"}),
    el("p",{text:"Für die neue Kartesa-Website beschreiben wir die Kollegin, der Kartesa am meisten hilft: Sie nutzt eine Praxissoftware für Termine und Rechnungen, aber die Dokumentation bleibt liegen oder läuft auf Papier. Wir wollen wissen, was sie drückt, wohin sie will, was sie schon weiß und was sie zögern lässt."}),
    el("p",{text:"Denk bei allen Fragen an Kolleginnen, die so arbeiten, nicht an alle, die du kennst. Mit „sie“ ist immer diese Kollegin gemeint. Wenn etwas auf keine zutrifft, die du kennst, ist das eine wichtige Antwort."}),
    el("p",{text:"Es sind "+FRAGEN.length+" Fragen, das dauert etwa 30 Minuten. Bei Aussagen wählst du Ja, Nein oder Anders, manchmal bringst du Punkte in eine Reihenfolge oder schreibst ein paar Worte. Am Ende kommen Fragen zum Preis."}),
    el("div",{class:"hinweis",text: docRef
      ? "Deine Antworten werden nach jeder Frage gespeichert. Du kannst jederzeit aufhören und später weitermachen. Bitte schreib keine Namen von Patientinnen oder Kolleginnen hinein."
      : "Deine Antworten bleiben auf diesem Gerät und in diesem Browser. Du kannst aufhören und später hier weitermachen. Am Ende kopierst du alle Antworten mit einem Knopf und schickst sie Tilman per Mail oder Nachricht. Bitte schreib keine Namen von Patientinnen oder Kolleginnen hinein."}),
    el("div",{class:"navi"}, el("span"), el("button",{class:"btn cta",type:"button",id:"startBtn",text: FRAGEN.some(beantwortet) ? "Weitermachen" : "Los geht’s", onclick:()=>{
      const offen = FRAGEN.findIndex(f=>!beantwortet(f));
      zeigeFrage(offen<0 ? 0 : offen);
    }}))
  );
}

function zeigeFrage(i){
  s.schritt=i; fortschritt();
  const f=FRAGEN[i];
  const a = s.antworten[f.id] || (s.antworten[f.id]={});
  const teile=[ el("div",{class:"abschnitt",text:f.abschnitt}) ];
  if(f.szene){ teile.push(el("p",{class:"leise",text:"Sonntagabend bei einer Heilpraktikerin:"}), el("div",{class:"szene",text:SZENE})); }
  teile.push(el("p",{class:"aussage",id:"aussage",text:f.text}));
  if(f.hilfe && f.art!=="urteil") teile.push(el("p",{class:"leise",text:f.hilfe}));

  let notiz;
  const pflichtHinweis = el("span",{class:"pflicht",text:"Bitte schreib kurz dazu, wie es anders ist."});
  pflichtHinweis.hidden = true;

  if(f.art==="urteil"){
    const gruppe=el("div",{class:"wahl",role:"group","aria-labelledby":"aussage"});
    for(const w of ["Ja","Nein","Anders"]){
      const b=el("button",{type:"button","aria-pressed":String(a.wahl===w),text:w,onclick:()=>{
        a.wahl=w; for(const x of gruppe.children) x.setAttribute("aria-pressed",String(x.textContent===w));
        if(!f.hilfe) notizLabel.firstChild.textContent = w==="Ja" ? "Anmerkung (freiwillig)" : w==="Nein" ? "Was stimmt nicht? (freiwillig)" : "Wie ist es stattdessen?";
        pruefe(); speichern();
      }});
      gruppe.append(b);
    }
    teile.push(gruppe);
  }
  if(f.art==="auswahl"){
    const box=el("div",{class:"optionen",role:"group","aria-labelledby":"aussage"});
    for(const o of f.optionen){
      box.append(el("button",{type:"button","aria-pressed":String(a.wahl===o),text:o,onclick:()=>{
        a.wahl=o; for(const x of box.children) x.setAttribute("aria-pressed",String(x.textContent===o));
        pruefe(); speichern();
      }}));
    }
    teile.push(box);
  }
  if(f.art==="rang"){
    const liste=el("ol",{class:"rang","aria-labelledby":"aussage"});
    const reihe=()=>a.reihenfolge || f.optionen.slice();
    const zeichne=()=>{
      const r=reihe();
      liste.replaceChildren(...r.map((o,k)=>el("li",{},
        el("span",{text:o}),
        el("span",{class:"pfeile"},
          el("button",{type:"button","aria-label":"„"+o+"“ nach oben",text:"↑",disabled:k===0?"":null,onclick:()=>schiebe(k,-1)},),
          el("button",{type:"button","aria-label":"„"+o+"“ nach unten",text:"↓",disabled:k===r.length-1?"":null,onclick:()=>schiebe(k,1)})))));
    };
    const schiebe=(k,d)=>{ const r=reihe().slice(); [r[k],r[k+d]]=[r[k+d],r[k]]; a.reihenfolge=r; zeichne(); pruefe(); speichern(); };
    zeichne();
    const passt=el("button",{class:"btn",type:"button",text:"Reihenfolge passt so",onclick:()=>{ a.reihenfolge=reihe(); pruefe(); speichern(); passt.hidden=true; }});
    passt.hidden=Array.isArray(a.reihenfolge);
    teile.push(liste, passt);
  }
  if(f.art==="zahl"){
    const inp=el("input",{type:"number",id:"wert-"+f.id,inputmode:"decimal",min:"0",step:"any"});
    if(a.wert!=null) inp.value=a.wert;
    inp.addEventListener("input",()=>{ a.wert = inp.value==="" ? null : Number(inp.value); pruefe(); });
    inp.addEventListener("change",speichern);
    teile.push(el("label",{class:"feld",for:"wert-"+f.id}, "Betrag", el("div",{class:"zahl"}, inp, el("span",{class:"einheit",text:f.einheit}))));
  }
  notiz=el("textarea",{id:"notiz-"+f.id,rows:"3"});
  notiz.value=a.notiz||"";
  notiz.addEventListener("input",()=>{ a.notiz=notiz.value; pruefe(); });
  notiz.addEventListener("change",speichern);
  const notizText = f.art==="text" ? "Deine Antwort" : f.art==="zahl" ? "Begründung oder Spanne (freiwillig)" : (f.art==="rang"||f.art==="auswahl") ? "Anmerkung (freiwillig)" : (f.hilfe || (a.wahl==="Anders" ? "Wie ist es stattdessen?" : "Anmerkung (freiwillig)"));
  const notizLabel=el("label",{class:"feld",for:"notiz-"+f.id}, notizText, notiz);
  teile.push(notizLabel, pflichtHinweis);

  const zurueck=el("button",{class:"btn",type:"button",text:"Zurück",onclick:()=>{ speichern(); i===0 ? zeigeStart() : zeigeFrage(i-1); }});
  const weiter=el("button",{class:"btn vor",type:"button",id:"weiterBtn",text: i===FRAGEN.length-1 ? "Zur Übersicht" : "Weiter",onclick:()=>{ speichern(); i===FRAGEN.length-1 ? zeigeUebersicht() : zeigeFrage(i+1); }});
  const auslassen=el("button",{class:"btn",type:"button",text:"Überspringen",onclick:()=>{ speichern(); i===FRAGEN.length-1 ? zeigeUebersicht() : zeigeFrage(i+1); }});
  teile.push(el("div",{class:"navi"}, zurueck, el("div",{style:"display:flex;gap:10px;flex-wrap:wrap"}, auslassen, weiter)));
  karte.replaceChildren(...teile);

  function pruefe(){
    const anders = f.art==="urteil" && a.wahl==="Anders" && !(a.notiz||"").trim();
    pflichtHinweis.hidden = !anders;
    weiter.disabled = !beantwortet(f);
    auslassen.hidden = beantwortet(f) || anders;
    fortschritt();
  }
  pruefe();
  (f.art==="zahl" ? karte.querySelector("input") : f.art==="text" ? notiz : karte.querySelector(".wahl button, .optionen button, .rang button:not([disabled])"))?.focus({preventScroll:true});
}

function chipFuer(f){
  const a=s.antworten[f.id]||{};
  if(f.art==="urteil" && a.wahl) return el("span",{class:"chip "+a.wahl.toLowerCase(),text:a.wahl});
  if(f.art==="zahl" && a.wert!=null && a.wert!=="") return el("span",{class:"chip wert",text:a.wert+" "+f.einheit});
  if(f.art==="rang" && Array.isArray(a.reihenfolge)) return el("span",{class:"chip wert",text:"geordnet"});
  if(f.art==="auswahl" && a.wahl) return el("span",{class:"chip wert",text:"gewählt"});
  if(f.art==="text" && (a.notiz||"").trim()) return el("span",{class:"chip ja",text:"beantwortet"});
  return el("span",{class:"chip leer",text:"offen"});
}

function alsText(){
  const z=["Prüfbogen Wunschkundin (IV-149, v2), Stand "+new Date().toLocaleString("de-DE"),""];
  for(const f of FRAGEN){
    const a=s.antworten[f.id]||{};
    let w = f.art==="rang" ? (Array.isArray(a.reihenfolge) ? "\n"+a.reihenfolge.map((o,k)=>"      "+(k+1)+". "+o).join("\n") : "offen") : f.art==="auswahl" ? (a.wahl||"offen") : f.art==="urteil" ? (a.wahl||"offen") : f.art==="zahl" ? (a.wert!=null&&a.wert!=="" ? a.wert+" "+f.einheit : "offen") : "";
    z.push(f.id+" · "+f.text);
    if(w) z.push("   Antwort: "+w);
    if((a.notiz||"").trim()) z.push("   Notiz: "+a.notiz.trim());
    z.push("");
  }
  return z.join("\n");
}

function zeigeUebersicht(){
  s.schritt=FRAGEN.length; fortschritt();
  const offen=FRAGEN.filter(f=>!beantwortet(f)).length;
  const liste=el("div",{class:"uebersicht"});
  FRAGEN.forEach((f,i)=>liste.append(el("button",{type:"button",onclick:()=>zeigeFrage(i)},
    el("span",{class:"nr",text:f.id}), el("span",{class:"kurz",text:f.text}), chipFuer(f))));
  const kopieFeld=el("textarea",{class:"kopie",id:"kopie",readonly:"",rows:"8"}); kopieFeld.value=alsText();
  const kopierHinweis=el("span",{class:"leise",id:"kopierHinweis"});
  const kopierKnopf=el("button",{class: docRef ? "btn" : "btn cta",type:"button",text:"Antworten kopieren",onclick:async()=>{
      try{ await navigator.clipboard.writeText(kopieFeld.value); kopierHinweis.textContent="Kopiert. Jetzt in eine Mail oder Nachricht an Tilman einfügen."; }
      catch(e){ kopieFeld.focus(); kopieFeld.select(); kopierHinweis.textContent="Der Text ist markiert. Kopiere ihn jetzt und füge ihn in eine Mail oder Nachricht an Tilman ein."; }
      if(!docRef){ s.fertig=true; lokalSchreiben(); }
    }});
  const teile=[
    el("div",{class:"abschnitt",text:"Übersicht"}),
    (docRef && s.fertig) ? el("p",{class:"fertig-marke",text:"Danke, Christiane. Deine Antworten sind angekommen."}) : el("h1",{text: offen ? "Fast fertig" : "Alles beantwortet"}),
    el("p",{text: offen ? offen+" Fragen sind noch offen. Tipp auf eine Zeile, um sie zu beantworten oder etwas zu ändern." : (docRef ? "Tipp auf eine Zeile, wenn du noch etwas ändern möchtest. Sonst schick den Bogen ab." : "Tipp auf eine Zeile, wenn du noch etwas ändern möchtest. Sonst kopiere deine Antworten unten und schick sie Tilman.")}),
    liste,
    el("div",{class:"navi"},
      el("button",{class:"btn",type:"button",text:"Zurück zur letzten Frage",onclick:()=>zeigeFrage(FRAGEN.length-1)}),
      docRef ? el("button",{class:"btn cta",type:"button",id:"abschickenBtn",text: s.fertig ? "Erneut abschicken" : "Bogen abschicken",onclick:async()=>{ s.fertig=true; await speichern(); zeigeUebersicht(); }}) : null)
  ];
  if(!docRef){
    teile.push(el("div",{class:"hinweis",text:"So kommen deine Antworten zu Tilman: Tipp auf „Antworten kopieren“ und füge den Text in eine Mail oder eine Nachricht an ihn ein."}));
  }
  teile.push(el("label",{class:"feld",for:"kopie"},"Alle Antworten als Text", kopieFeld),
    el("div",{class:"navi"}, kopierHinweis, kopierKnopf));
  karte.replaceChildren(...teile);
}

async function verbinden(){
  const lokal=lokalLesen();
  if(lokal){ Object.assign(s.antworten, lokal.antworten||{}); s.fertig=!!lokal.fertig; }
  zeigeStart();
  try{
    db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    const uid = user ? await user.id() : null;
    if(db && uid){
      docRef = db.doc("antworten/"+uid);
      const snap = await docRef.get();
      if(snap.exists){
        const d = snap.data();
        Object.assign(s.antworten, d.antworten||{});
        s.fertig = !!d.fertig;
      }
      setzeStatus("ok", snap.exists ? "Verbunden, Antworten geladen" : "Verbunden");
      if(s.schritt<0) zeigeStart();
    } else {
      setzeStatus("lokal","Antworten bleiben auf diesem Gerät");
      if(s.schritt<0) zeigeStart();
    }
  }catch(e){
    docRef=null;
    setzeStatus("lokal","Antworten bleiben auf diesem Gerät");
    if(s.schritt<0) zeigeStart();
  }
}
verbinden();
</script>
